name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Версия bash
        run: bash --version | head -1

      - name: Проверка синтаксиса
        run: bash -n hubtune.sh

      - name: Тесты
        run: bash tests/run-all.sh

      # Скрипт проходит shellcheck без единого замечания — держим это гейтом,
      # чтобы регрессия не проехала молча.
      - name: ShellCheck
        run: shellcheck -S warning hubtune.sh tests/*.sh
